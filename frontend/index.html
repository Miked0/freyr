<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F6F3" />
    <!-- Theme before the first paint: saved choice, else the system, else light. Mirrors src/lib/theme.ts. -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('freyr:theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        if (theme === 'dark') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0E1519');
        }
      })();
    </script>
    <style>:root[data-theme="dark"] { background: #0E1519; }</style>
    <title>Freyr · Seu dinheiro em ordem</title>
    <meta name="description" content="Envie o extrato do seu banco e o Freyr organiza o resto: cada gasto na categoria certa, o mês resumido e suas metas à vista. Sem planilhas." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Petrona:ital,wght@1,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
